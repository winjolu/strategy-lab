# Copy to holdings.toml and fill in from the broker. holdings.toml is not
# committed. Weights are market value over the invested total; cash is left
# out, which does not change a correlation.
as_of = "2026-01-02"
source = "example values, not a real account"

[[holding]]
symbol = "SPY"
table = "fundprices"
market_value = 5000.00

